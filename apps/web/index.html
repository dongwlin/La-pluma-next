<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-graphite.png?v=1" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-graphite.png?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA Meta Tags -->
    <meta name="description" content="MAA CLI 的现代化 Web 界面 - 自动化明日方舟游戏任务" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="La Pluma Next" />
    <style id="la-pluma-boot-style">
      :root {
        --boot-bg: #f2f2f7;
        --boot-text: #1c1c1e;
        --boot-viewport-height: 100dvh;
      }
      @supports not (height: 100dvh) {
        :root {
          --boot-viewport-height: 100vh;
        }
      }
      html.dark {
        --boot-bg: #000000;
        --boot-text: #f2f2f7;
      }
      @media (display-mode: standalone), (display-mode: fullscreen) {
        :root {
          --boot-viewport-height: 100lvh;
        }
      }
      html.la-pluma-standalone {
        --boot-viewport-height: 100lvh;
      }
      @supports not (height: 100lvh) {
        @media (display-mode: standalone), (display-mode: fullscreen) {
          :root {
            --boot-viewport-height: 100vh;
          }
        }
        html.la-pluma-standalone {
          --boot-viewport-height: 100vh;
        }
      }
      html {
        min-height: 100%;
        background-color: var(--boot-bg);
      }
      body,
      #root {
        min-height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      .la-pluma-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        height: var(--boot-viewport-height);
        overflow: hidden;
        background: var(--background, var(--boot-bg));
        transition: opacity 220ms ease-out;
      }
      .la-pluma-boot.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .la-pluma-boot {
          transition: none;
        }
      }
      .la-pluma-boot-brand {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .la-pluma-boot-logo {
        display: block;
        width: 4rem;
        height: 4rem;
        pointer-events: none;
      }
      .la-pluma-boot-name {
        color: var(--boot-text);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF UI Text', system-ui, sans-serif;
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.2;
        white-space: nowrap;
      }
    </style>
    <!-- 首帧主题脚本与 theme-color / apple-mobile-web-app-status-bar-style 两个 meta
         由 vite.config.ts 的 createBootAssetsPlugin 从 BOOT_THEME_COLORS 注入 -->

    <title>La Pluma Next - MAA WebUI</title>
  </head>
  <body>
    <div id="root"></div>
    <div
      class="la-pluma-boot"
      data-boot-shell
      role="status"
      aria-label="正在打开 La Pluma Next"
      aria-busy="true"
    >
      <div class="la-pluma-boot-brand">
        <img
          class="la-pluma-boot-logo"
          src="%BASE_URL%logo-graphite.svg?v=1"
          alt=""
          aria-hidden="true"
          draggable="false"
        />
        <span class="la-pluma-boot-name">La Pluma Next</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

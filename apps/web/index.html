<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-graphite.png?v=1" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-graphite.png?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="description" content="MAA CLI 的现代化 Web 界面 - 自动化明日方舟游戏任务" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="La Pluma Next" />
    <style id="la-pluma-boot-style">
      :root {
        --boot-bg: #f2f2f7;
        --boot-chrome: rgba(255, 255, 255, 0.82);
        --boot-surface: #ffffff;
        --boot-line: rgba(60, 60, 67, 0.11);
        --boot-accent: #007aff;
        --boot-viewport-height: 100dvh;
        --boot-bottom-clearance: clamp(
          0.5rem,
          env(safe-area-inset-bottom, 0px),
          1.25rem
        );
      }
      html.dark {
        --boot-bg: #000000;
        --boot-chrome: rgba(28, 28, 30, 0.86);
        --boot-surface: #1c1c1e;
        --boot-line: rgba(235, 235, 245, 0.13);
        --boot-accent: #0a84ff;
      }
      @media (display-mode: standalone), (display-mode: fullscreen) {
        :root {
          --boot-viewport-height: 100lvh;
        }
      }
      html.la-pluma-standalone {
        --boot-viewport-height: 100lvh;
      }
      @supports not (height: 100lvh) {
        @media (display-mode: standalone), (display-mode: fullscreen) {
          :root {
            --boot-viewport-height: 100vh;
          }
        }
        html.la-pluma-standalone {
          --boot-viewport-height: 100vh;
        }
      }
      html,
      body,
      #root {
        min-height: 100%;
        background-color: var(--boot-bg);
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      .la-pluma-boot {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 0.75rem;
        height: var(--boot-viewport-height);
        padding: 0 max(0.875rem, env(safe-area-inset-right, 0px))
          var(--boot-bottom-clearance) max(0.875rem, env(safe-area-inset-left, 0px));
        overflow: hidden;
        background: var(--boot-bg);
      }
      .la-pluma-boot > * {
        border-radius: 1.25rem;
        background: var(--boot-surface);
      }
      .la-pluma-boot-header {
        min-height: calc(3.5rem + env(safe-area-inset-top, 0px));
        background: var(--boot-chrome);
      }
      @media (prefers-reduced-motion: reduce) {
        .la-pluma-boot * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
    <!-- 首帧主题脚本与 theme-color / apple-mobile-web-app-status-bar-style 两个 meta
         由 vite.config.ts 的 createBootAssetsPlugin 从 BOOT_THEME_COLORS 注入 -->

    <title>La Pluma Next - MAA WebUI</title>
  </head>
  <body>
    <div id="root">
      <div class="la-pluma-boot" role="status" aria-label="正在打开 La Pluma Next" aria-busy="true">
        <div class="la-pluma-boot-header" aria-hidden="true"></div>
        <div class="la-pluma-boot-main" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

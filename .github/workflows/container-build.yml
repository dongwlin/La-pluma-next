name: Container build

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      arch:
        type: string
        required: true
      publish:
        type: boolean
        default: false

jobs:
  build-and-smoke:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in for release builds
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platform }}
          load: ${{ !inputs.publish }}
          tags: ${{ !inputs.publish && 'la-pluma-next:ci' || '' }}
          outputs: ${{ inputs.publish && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ inputs.arch }}
          # Only release jobs write the shared cache.
          cache-to: ${{ inputs.publish && format('type=registry,ref={0}:buildcache-{1},mode=max,ignore-error=true', steps.image.outputs.name, inputs.arch) || '' }}
      - name: Pull candidate by digest
        if: inputs.publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull "$IMAGE@$DIGEST"
      - name: Check root-path startup and HTTP behavior
        env:
          CANDIDATE: ${{ inputs.publish && format('{0}@{1}', steps.image.outputs.name, steps.build.outputs.digest) || 'la-pluma-next:ci' }}
        run: node scripts/ci/smoke-image.mjs "$CANDIDATE"
      # 子路径部署的 base path 在构建时写死到前端产物，必须单独构建一个只用于
      # 冒烟、不推送的变体；不复用 cache-to，避免覆盖根路径发布缓存。
      - name: Build sub-path variant for the startup check
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platform }}
          load: true
          tags: la-pluma-next:ci-subpath
          build-args: |
            VITE_BASE_PATH=/la-pluma-next/
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ inputs.arch }}
      - name: Check sub-path startup and HTTP behavior
        run: node scripts/ci/smoke-image.mjs la-pluma-next:ci-subpath --base-path /la-pluma-next/
      - name: Export verified platform digest
        if: inputs.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/digests
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$DIGEST_DIRECTORY"
          touch "$DIGEST_DIRECTORY/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: digests-${{ inputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

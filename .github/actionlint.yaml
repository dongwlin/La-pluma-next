# actionlint 内置的 GitHub 托管 runner 标签表可能滞后于 actions/runner-images
# 的发布节奏，这里补上已经 GA 但尚未内置的标签，避免本地检查误报。
# 参考：https://github.com/actions/runner-images#available-images
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm

# actionlint 1.7.12 尚未支持 2026-05 已发布的 concurrency.queue。
# 仅放行该新键的 schema 提示，其余语法与 ShellCheck 错误仍阻断。
# https://github.blog/changelog/2026-05-07-github-actions-concurrency-groups-now-allow-larger-queues/
paths:
  .github/workflows/ci.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\.'

services:
  la-pluma-next:
    # 使用 GHCR 预构建镜像（推荐）
    # 生产环境建议固定 digest，例如 ghcr.io/dongwlin/la-pluma-next@sha256:...
    image: ghcr.io/dongwlin/la-pluma-next:latest

    # 或者本地构建（如果需要修改代码）
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: la-pluma-next
    volumes:
      # 持久化用户配置和数据
      - ./docker-data/server:/app/server/data
      # 持久化 MAA 配置目录（任务、profiles 等）
      - ./docker-data/maa-config:/root/.config/maa
      # 持久化 MAA 数据目录（MaaCore、资源文件等）
      - ./docker-data/maa-core:/root/.local/share/maa
      # 持久化 MAA 状态目录（日志、缓存等，Linux 默认 ~/.local/state/maa）
      - ./docker-data/maa-state:/root/.local/state/maa
      # 持久化 ScrcpyOverWebRTC 工作目录（源码构建、设备 Agent 与日志）
      - ./docker-data/webrtc:/root/ScrcpyOverWebRTC
      # 可选：HTTPS 证书目录，只读挂载
      # - ./certs:/app/certs:ro
    environment:
      - NODE_ENV=production
      - PORT=3000  # 容器内监听 3000 端口
      # 自定义镜像若使用 VITE_BASE_PATH 构建，运行路径会自动匹配；手动覆盖时两者需一致
      # - LA_PLUMA_BASE_PATH=/la-pluma-next/
      # ADB 设备地址（bridge 模式下使用宿主机 IP，按实际环境修改）
      - ADB_ADDRESS=${ADB_ADDRESS:-192.168.1.100:5555}
      # 必配：保护 /api/* 与 WebRTC 同源网关票据入口；复制 .env.example 为 .env 后设置
      - LA_PLUMA_TOKEN=${LA_PLUMA_TOKEN:?set LA_PLUMA_TOKEN in .env or the shell}
      # 可选：实时日志内存缓存上限，默认 5000 行
      # - LA_PLUMA_MAX_REALTIME_LOGS=5000
      # 可选：手机安装 PWA 时使用可信 HTTPS，证书与私钥必须同时配置
      # - LA_PLUMA_HTTPS_CERT_PATH=/app/certs/fullchain.pem
      # - LA_PLUMA_HTTPS_KEY_PATH=/app/certs/privkey.pem

    # 默认只绑定回环地址，避免把未加密的管理界面暴露到局域网。
    # 需要手机/局域网访问时，应配置 LA_PLUMA_TOKEN 后再改为 "3055:3000"，并用防火墙限制来源。
    ports:
      - "127.0.0.1:3055:3000"  # 宿主机 3055 映射到容器 3000

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "scheme=http; if [ -n \"$$LA_PLUMA_HTTPS_CERT_PATH\" ]; then scheme=https; fi; curl -fk \"$$scheme://localhost:$${PORT:-3000}/health\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s
